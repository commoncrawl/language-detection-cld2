name: Build and test on multiple platforms

on:
  push:
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-latest]
        variant: [standard, full]

    runs-on: ${{ matrix.os }}

    continue-on-error: ${{ matrix.variant == 'full' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build and test (standard)
        if: matrix.variant == 'standard'
        run: mvn clean test -q

      - name: Build and test (full)
        if: matrix.variant == 'full'
        run: mvn clean test -Pfull -q

      - name: Verify native library loaded
        run: |
          echo "Testing ${{ matrix.variant }} variant on ${{ matrix.os }}"
          mvn verify
