name: Build and test on multiple platforms

on:
  push:
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build and test
        run: mvn clean test -q

      - name: Verify native library loaded
        run: |
          echo "Testing on ${{ matrix.os }}"
          mvn verify
